# Conexion local a MySQL. Cambia usuario y clave por los de tu equipo.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/doctor_manager?serverTimezone=America/Lima}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# Se utiliza el SQL incluido en database/; JPA no modifica la estructura de tablas.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Desactiva cache de plantillas para visualizar cambios durante el desarrollo.
spring.thymeleaf.cache=false
server.port=${PORT:8080}
server.error.whitelabel.enabled=false
