<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Clínicas | Doctor-Manager</title><link rel="stylesheet" th:href="@{/css/styles.css}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar('clinics')}"></div>
<main class="container">
    <div class="section-head"><div><h1>Clínicas</h1><span class="small-muted">Gestión de establecimientos de salud</span></div><a class="button" th:href="@{/clinics/new}">+ Nueva clínica</a></div>
    <!-- RedirectAttributes: mensajes flash de la operación anterior. -->
    <div class="flash" th:if="${msg != null}" th:text="${msg}"></div>
    <div class="flash error" th:if="${error != null}" th:text="${error}"></div>
    <section class="panel table-wrap">
        <table><thead><tr><th>ID</th><th>Nombre</th><th>Dirección</th><th>Teléfono</th><th>Acciones</th></tr></thead>
            <tbody><tr th:each="clinic : ${clinics}">
                <td th:text="${clinic.id}"></td>
                <td th:text="${clinic.name}"></td>
                <td th:text="${clinic.address}"></td>
                <td th:text="${clinic.phoneNumber}"></td>
                <td>
                    <a class="button small secondary" th:href="@{/clinics/detail(id=${clinic.id})}">Detalle</a> <a class="button small secondary" th:href="@{/clinics/edit(id=${clinic.id})}">Editar</a>
                    <!-- Eliminar requiere POST, no un enlace GET. -->
                    <form class="inline-form" th:action="@{/clinics/delete}" method="post"><input type="hidden" name="id" th:value="${clinic.id}"><button class="button small danger" type="submit">Eliminar</button></form>
                </td>
            </tr></tbody>
        </table>
        <div class="empty" th:if="${#lists.isEmpty(clinics)}">Todavía no se registraron clínicas.</div>
    </section>
</main>
</body></html>
