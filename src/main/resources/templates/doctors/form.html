<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Formulario de doctor</title><link rel="stylesheet" th:href="@{/css/styles.css}"></head>
<body><div th:replace="~{fragments/navbar :: navbar('doctors')}"></div>
<main class="container"><section class="panel">
    <h1 th:text="${doctorForm.id == null} ? 'Nuevo doctor' : 'Editar doctor'"></h1>
    <form th:action="@{/doctors/save}" th:object="${doctorForm}" method="post" novalidate>
        <input type="hidden" th:field="*{id}">
        <div class="global-errors" th:if="${#fields.hasGlobalErrors()}"><p th:each="err : ${#fields.globalErrors()}" th:text="${err.defaultMessage}"></p></div>
        <div class="form-grid">
            <div class="form-field full"><label for="fullName">Nombre completo *</label><input type="text" th:field="*{fullName}" maxlength="100"><span class="field-error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></span></div>
            <div class="form-field"><label for="dni">DNI (8 dígitos) *</label><input type="text" th:field="*{dni}" maxlength="20"><span class="field-error" th:if="${#fields.hasErrors('dni')}" th:errors="*{dni}"></span></div>
            <div class="form-field"><label for="phoneNumber">Teléfono (9 dígitos) *</label><input type="text" th:field="*{phoneNumber}" maxlength="20"><span class="field-error" th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}"></span></div>
            <div class="form-field"><label for="email">Correo electrónico *</label><input type="text" th:field="*{email}" maxlength="100"><span class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span></div>
            <div class="form-field"><label for="incorporationDate">Fecha de incorporación *</label><input type="date" th:field="*{incorporationDate}"><span class="field-error" th:if="${#fields.hasErrors('incorporationDate')}" th:errors="*{incorporationDate}"></span></div>
            <div class="form-field"><label for="stateId">Estado *</label><select th:field="*{stateId}"><option value="">-- Seleccione un estado --</option><option th:each="state : ${states}" th:value="${state.id}" th:text="${state.name}"></option></select><span class="field-error" th:if="${#fields.hasErrors('stateId')}" th:errors="*{stateId}"></span></div>
        </div>
        <p class="actions"><button type="submit" class="button">Guardar doctor</button><a class="button secondary" th:href="@{/doctors}">Cancelar</a></p>
    </form>
</section></main></body></html>
